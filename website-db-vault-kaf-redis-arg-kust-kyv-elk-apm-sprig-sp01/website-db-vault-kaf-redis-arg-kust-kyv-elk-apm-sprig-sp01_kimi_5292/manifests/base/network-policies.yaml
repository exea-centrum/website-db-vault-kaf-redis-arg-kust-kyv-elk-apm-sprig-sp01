apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fastapi-to-postgres
  namespace: davtro
spec:
  podSelector:
    matchLabels:
      app: 
      component: fastapi
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: 
              component: postgres
      ports:
        - protocol: TCP
          port: 5432

