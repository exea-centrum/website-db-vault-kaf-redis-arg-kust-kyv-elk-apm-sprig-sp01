apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fastapi-monitor
  namespace: davtro
  labels:
    app: 
    app.kubernetes.io/name: 
    app.kubernetes.io/instance: 
spec:
  selector:
    matchLabels:
      app: 
      component: fastapi
  endpoints:
  - port: http
    path: /metrics
    interval: 15s

