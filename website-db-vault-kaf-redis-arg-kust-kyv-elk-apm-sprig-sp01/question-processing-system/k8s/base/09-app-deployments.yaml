apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
  namespace: question-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-app
  template:
    metadata:
      labels:
        app: fastapi-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: question-system-sa
      containers:
      - name: fastapi
        image: fastapi-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: fastapi-config
        - secretRef:
            name: redis-credentials
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-processor
  namespace: question-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-processor
  template:
    metadata:
      labels:
        app: message-processor
    spec:
      serviceAccountName: question-system-sa
      containers:
      - name: processor
        image: message-processor:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: message-processor-config
        - secretRef:
            name: postgres-credentials
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-to-kafka
  namespace: question-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-to-kafka
  template:
    metadata:
      labels:
        app: redis-to-kafka
    spec:
      serviceAccountName: question-system-sa
      containers:
      - name: bridge
        image: redis-to-kafka:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: redis-to-kafka-config
        - secretRef:
            name: redis-credentials
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: question-system
spec:
  selector:
    app: fastapi-app
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
