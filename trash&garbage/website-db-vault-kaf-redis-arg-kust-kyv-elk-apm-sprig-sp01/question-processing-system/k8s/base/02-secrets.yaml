apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: question-system
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_password"
  POSTGRES_DB: "questions_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: question-system
type: Opaque
stringData:
  REDIS_PASSWORD: "redis_secure_password"
