apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: davtro
data:
  loki-config.yaml: |
    auth_enabled: false
    server: { http_listen_port: 3100 }
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v12
          index: { prefix: index_, period: 24h }
    storage_config:
      filesystem: { directory: /loki/chunks }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: davtro
spec:
  replicas: 1
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          ports: [{ containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: davtro
spec:
  selector: { app: loki }
  ports: [{ port: 3100, targetPort: 3100 }]
