# KROK 5 (PKI): cert-manager zamawia certy w Vault PKI, sam odnawia przed
# wygasnieciem (renewBefore) i sklada je w Sekrety tls.crt/tls.key.
# Wymaga na klastrze (raz, poza Gitem): microk8s enable ingress + cert-manager
# z CRD (helm install jetstack/cert-manager --set crds.enabled=true).
# ClusterIssuer jest klastrowy (cert-manager potrzebuje roli K8s auth w Vault),
# a Certificate leza w davtro02 obok Ingressow, ktore je konsumuja (spec.tls).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: http://vault.davtro02.svc.cluster.local:8200
    path: pki/sign/davtro-ingress
    auth:
      tokenSecretRef:
        name: cert-manager-vault-token
        key: token
---
# KROK 6 (mTLS): ClusterIssuer dla certyfikatów wewnętrznych (davtro-internal).
# Używany przez mtls-certificates.yaml do wystawiania certyfikatów client-cert.
# Wymaga: Vault PKI role davtro-internal, policy pki-internal, auth role cert-manager-internal.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer-internal
spec:
  vault:
    server: http://vault.davtro02.svc.cluster.local:8200
    path: pki/issue/davtro-internal
    auth:
      kubernetes:
        mountPath: kubernetes
        role: cert-manager-internal
        serviceAccountRef:
          name: cert-manager
