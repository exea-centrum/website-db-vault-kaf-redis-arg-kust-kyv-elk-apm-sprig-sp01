# Vault - tryb produkcyjny: storage raft na PV (dane trwale), UI, telemetria Prometheus.
# Po restarcie poda Vault jest SEALED - wymagany reczny unseal (klucze NIE sa w K8s/Git).
#
# RUNBOOK pierwszego uruchomienia (jednorazowo):
#   kubectl -n davtro02 port-forward vault-0 8200:8200 &
#   export VAULT_ADDR=http://127.0.0.1:8200
#   vault operator init -key-shares=1 -key-threshold=1
#     -> zapisz unseal_key i root_token POZA repozytorium (menedzer hasel)!
#   vault operator unseal <unseal_key>
#
# Audit (stdout -> promtail -> Loki -> Grafana):
#   export VAULT_TOKEN=<root_token>
#   vault audit enable file file_path=stdout
#
# Token do CronJoba snapshotow (vault-snapshot.yaml):
#   kubectl -n davtro02 create secret generic vault-snapshot \
#     --from-literal=VAULT_TOKEN=<root_token>
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: davtro02
data:
  config.hcl: |
    disable_mlock = true
    ui = true
    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable     = true   # KROK 9: zostaje jako fallback (bootstrap przy pierwszym starcie
                               # jeszcze nie ma certu) + metryki scrape; docelowo do wylaczenia
    }
    # KROK 9: TLS listener jest w config-tls.hcl (start.sh wybiera config wg
    # dostepnosci certu - rozwiazuje klero-wajke: cert wymaga dzialajacego Vaulta).
    telemetry {
      prometheus_retention = "12h"
    }
  config-tls.hcl: |
    # KROK 9: dual-listener - plain 8200 (bootstrap/fallback/metryki) + TLS 8203.
    disable_mlock = true
    ui = true
    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }
    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_disable     = true
    }
    listener "tcp" {
      address         = "0.0.0.0:8203"
      cluster_address = "0.0.0.0:8202"
      tls_cert_file     = "/vault/tls/tls.crt"
      tls_key_file      = "/vault/tls/tls.key"
      tls_client_ca_file = "/vault/tls/ca.crt"
      tls_min_version   = "tls12"
    }
    telemetry {
      prometheus_retention = "12h"
    }
  start.sh: |
    #!/bin/sh
    # KROK 9: wybiera config wg dostepnosci certu - rozwiazuje klero-wajke
    # (certyfikat vault-tls moze byc wystawiony dopiero po starcie Vaulta).
    # Marker /tmp/tls-enabled czyta vault-bootstrap (auto-restart po pojawieniu sie certu).
    if [ -f /vault/tls/tls.crt ] && [ -f /vault/tls/tls.key ]; then
      echo "Vault: TLS listener :8203 wlaczony (cert z Vault PKI)"
      cp /vault/config/config-tls.hcl /tmp/vault.hcl
      touch /tmp/tls-enabled
    else
      echo "Vault: brak certu (secret vault-tls) - start plain :8200 (bootstrap wystawi cert)"
      cp /vault/config/config.hcl /tmp/vault.hcl
    fi
    exec vault server -config=/tmp/vault.hcl
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: davtro02
spec:
  serviceName: vault
  replicas: 1
  selector: { matchLabels: { app: vault } }
  template:
    metadata:
      labels: { app: vault }
    spec:
      serviceAccountName: davtro-sa
      securityContext:
        runAsUser: 100        # user 'vault' z obrazu hashicorp/vault
        runAsGroup: 1000      # grupa 'vault' z obrazu hashicorp/vault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # microk8s-hostpath nie stosuje fsGroup - katalog PV zostaje root:root
        # (ten sam problem co w postgres.yaml). InitContainer (celowo jako root)
        # nadaje wlasciciela przed startem vault.
        - name: fix-data-permissions
          image: hashicorp/vault:1.17
          command: ["sh", "-c", "chown -R 100:1000 /vault/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            # celowo root: nadpisuje runAsNonRoot z poziomu poda,
            # inaczej kubelet odrzuca initContainer (jak w postgres.yaml)
            runAsNonRoot: false
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: vault
          image: hashicorp/vault:1.17
          command: ["sh", "/vault/config/start.sh"]
          ports:
            - { containerPort: 8200, name: http }
            - { containerPort: 8201, name: internal }
          env:
            - name: VAULT_API_ADDR
              value: http://vault-0.vault.davtro02.svc.cluster.local:8200
            - name: VAULT_CLUSTER_ADDR
              value: http://vault-0.vault.davtro02.svc.cluster.local:8201
          readinessProbe:
            # sealedcode=200 + standbyok: pod gotowy tez przed init/unseal
            # (single-node - bez unseala i tak nie obsluzy ruchu)
            httpGet:
              path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=204"
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=204"
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: vault-config }
        # optional: cert moze jeszcze nie istniec przy pierwszym starcie (klero-wajka)
        - name: vault-tls
          secret: { secretName: vault-tls, optional: true }
  volumeClaimTemplates:
    - metadata: { name: vault-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: davtro02
spec:
  selector: { app: vault }
  ports:
    - { name: http, port: 8200, targetPort: 8200 }
    - { name: internal, port: 8201, targetPort: 8201 }
    - { name: https, port: 8203, targetPort: 8203 }
