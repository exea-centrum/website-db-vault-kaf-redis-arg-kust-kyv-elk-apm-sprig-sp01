# ETAP 2 (Istio) - default-deny-ingress (network-policies.yaml) odcina ruch
# z namespace `istio-system` do aplikacji, tak samo jak wczesniej odcinal Traefika
# (reguly allow-ingress-controller-to-* zostaja nietkniete = parytet/droga powrotu).
#
# Dlatego dodajemy JAWNE wpuszczenie istio-ingressgateway -> back-endy.
# NICZEGO nie usuwamy - to regula DODATKOWA (uzupelnia, nie zastepuje).
#
# UWAGA: celowo BEZ `ports:` - back-endy maja rozne porty (8080/3000/80/8082),
# a w ETAPIE 6 (sidecary) dojda porty Envoy 15020/15021/15090 i wtedy zamiast
# dopisywac porty do kazdej reguly, ta jedna regula juz je przepuszcza.
# Jesli chcesz twardo (tylko porty aplikacji) - rozbij na reguly per-port i
# pamietaj o dodaniu 15020/15021/15090 przed wlaczeniem sidecarow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingressgateway
  namespace: davtro02
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - fastapi-web-app
          - frontend
          - grafana
          - kafka-ui
          - pgadmin
          - spark-master
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
  policyTypes:
    - Ingress
---
# ETAP 6 (Istio, sidecary): porty agenta/Envoya potrzebne, gdy pod dostanie sidecar.
# default-deny-ingress blokuje 15020, a injector PRZEPISUJE proby kubeleta wlasnie na
# :15020 (rewriteAppHTTPProbe) -> bez tej reguly pody nie beda Ready.
#   15020 - pilot-agent: /healthz/ready + scalone metryki (proby + Prometheus)
#   15021 - status-port Envoya (readiness gatewaya)
#   15090 - Envoy /stats/prometheus (scrape)
# Brak `from:` = dowolne zrodlo (kubelet nie jest podem, wiec nie da sie go wskazac
# podSelector-em). To porty tylko do odczytu stanu, bez powierzchni aplikacyjnej.
# Regula jest bezpieczna takze PRZED wlaczeniem sidecarow - nic tam nie slucha.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-probe-and-metrics-ports
  namespace: davtro02
spec:
  podSelector: {}
  ingress:
    - ports:
        - { protocol: TCP, port: 15020 }
        - { protocol: TCP, port: 15021 }
        - { protocol: TCP, port: 15090 }
  policyTypes:
    - Ingress

