# KROK 3: dynamiczne credsy PostgreSQL z Vault database engine.
# WYMAGA wczesniej: scripts/vault-db-bootstrap.sh (engine database + rola davtro-app-rw).
# Jak to dziala:
#  - ESO przy kazdym refresh (30m) pobiera z Vault NOWY lease -> nowy tymczasowy user PG,
#    stary wygasa po default_ttl (1h) roli (rotacja z zapasem),
#  - sekrety montowane w podach jako PLIKI (kubelet odswieza montaz po update sekretu),
#  - aplikacje Python (db.py / main.py) wykrywaja zmiane plikow i przelaczaja polaczenia.
# Spring i Spark zostaja na static credsy z davtro-secrets (migracja: Spring Cloud Vault, Krok 4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fastapi-db-creds
  namespace: davtro02
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: fastapi-db-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: database/creds/davtro-app-rw, property: username }
    - secretKey: password
      remoteRef: { key: database/creds/davtro-app-rw, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: message-processor-db-creds
  namespace: davtro02
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: message-processor-db-creds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: database/creds/davtro-app-rw, property: username }
    - secretKey: password
      remoteRef: { key: database/creds/davtro-app-rw, property: password }